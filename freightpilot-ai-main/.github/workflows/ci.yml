name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freightpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freightpilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DEMO_MODE: "true"
      AUTO_CREATE_DB: "false"
      AUTH_REQUIRED: "false"
      DATABASE_URL: sqlite:///./ci-test.db
      JWT_SECRET_KEY: ci-only-secret-not-for-deployment-use-32-bytes-minimum
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: pytest -q
      - name: Validate fresh PostgreSQL database migrations
        env:
          APP_ENV: test
          DEMO_MODE: "false"
          AUTO_CREATE_DB: "false"
          AUTH_REQUIRED: "false"
          RATE_LIMIT_ENABLED: "false"
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/freightpilot_ci
          JWT_SECRET_KEY: ci-only-secret-not-for-deployment-use-32-bytes-minimum
        run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
