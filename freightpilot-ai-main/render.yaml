# Render Blueprint for the FastAPI API, PostgreSQL, Redis, and Frontend static site.
# All credentials are entered in Render Dashboard.
services:
  - type: web
    name: freightpilot-ai-backend
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: AUTO_CREATE_DB
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: freightpilot-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: freightpilot-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: freightpilot-frontend
          property: url
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: API_PUBLIC_URL
        fromService:
          type: web
          name: freightpilot-ai-backend
          property: url
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: APPLE_REDIRECT_URI
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        value: ""
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        value: ""
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DOCUMENT_STORAGE_PATH
        value: ./var/documents
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"

  - type: keyvalue
    name: freightpilot-redis
    plan: 256mb
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: freightpilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: freightpilot-ai-backend
          property: url
      - key: VITE_PAYPAL_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_APPLE_CLIENT_ID
        sync: false
      - key: VITE_APPLE_REDIRECT_URI
        sync: false

databases:
  - name: freightpilot-postgres
    plan: 0.1c-256mb
    region: singapore
    databaseName: freightpilot
    user: freightpilot
    ipAllowList: []
